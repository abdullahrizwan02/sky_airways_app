{% extends 'base.html' %}
{% block title %}{{ 'Edit' if flight else 'Add' }} Flight — Admin{% endblock %}
{% block content %}
<section class="py-16 px-6 bg-slate-50"><div class="max-w-4xl mx-auto"><h1 class="text-4xl font-black">{{ 'Edit' if flight else 'Add' }} flight</h1><form method="post" class="premium-card p-7 mt-8 grid md:grid-cols-2 gap-4"><input class="form-field" name="flight_number" placeholder="Flight number" value="{{ flight.flight_number if flight else '' }}" required><input class="form-field" name="aircraft_type" placeholder="Aircraft type" value="{{ flight.aircraft_type if flight else 'Airbus A320neo' }}" required><input class="form-field" name="departure_airport" placeholder="Departure airport" value="{{ flight.departure_airport if flight else 'Lahore (LHE)' }}" required><input class="form-field" name="arrival_airport" placeholder="Arrival airport" value="{{ flight.arrival_airport if flight else 'Dubai (DXB)' }}" required><input class="form-field" name="departure_city" placeholder="Departure city" value="{{ flight.departure_city if flight else 'Lahore' }}" required><input class="form-field" name="arrival_city" placeholder="Arrival city" value="{{ flight.arrival_city if flight else 'Dubai' }}" required><input class="form-field" name="departure_time" placeholder="2026-07-01 09:00" value="{{ flight.departure_time if flight else '' }}" required><input class="form-field" name="arrival_time" placeholder="2026-07-01 12:30" value="{{ flight.arrival_time if flight else '' }}" required><input class="form-field" name="duration" placeholder="3h 30m" value="{{ flight.duration if flight else '3h 30m' }}" required><select class="form-field" name="cabin_class"><option>Economy</option><option>Premium Economy</option><option>Business</option><option>First Class</option></select><input class="form-field" name="total_seats" placeholder="Total seats" value="{{ flight.total_seats if flight else '36' }}"><input class="form-field" name="fare" placeholder="Fare" value="{{ flight.fare if flight else '75000' }}" required><select class="form-field" name="status"><option>On Time</option><option>Boarding</option><option>Delayed</option><option>Departed</option><option>Arrived</option></select><button class="btn-primary md:col-span-2">Save flight</button></form></div></section>
{% endblock %}
