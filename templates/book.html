{% extends 'base.html' %}
{% block title %}Book a Flight — Sky Airways{% endblock %}
{% block content %}
<section class="py-16 px-6 bg-gradient-to-b from-sky-50 to-white"><div class="max-w-6xl mx-auto"><p class="text-accent font-black uppercase tracking-[.25em] text-xs">Premium booking wizard</p><h1 class="section-title mt-3">Book your next journey.</h1><div class="flex flex-wrap gap-3 my-8"><span class="step-pill active">1 Search Flight</span><span class="step-pill">2 Select Flight</span><span class="step-pill">3 Passenger Details</span><span class="step-pill">4 Seat Selection</span><span class="step-pill">5 Payment</span><span class="step-pill">6 Confirmation</span></div><form action="{{ url_for('flights') }}" class="booking-glass rounded-3xl p-7 grid md:grid-cols-3 gap-5"><div><label class="label">Trip type</label><select class="form-field"><option>Round Trip</option><option>One Way</option><option>Multi City</option></select></div><div><label class="label">From</label><select name="from" class="form-field">{% for a in airports %}<option>{{ a }}</option>{% endfor %}</select></div><div><label class="label">To</label><select name="to" class="form-field">{% for a in airports[3:] %}<option>{{ a }}</option>{% endfor %}</select></div><div><label class="label">Departure date</label><input type="date" name="date" class="form-field"></div><div><label class="label">Return date</label><input type="date" name="return_date" class="form-field"></div><div><label class="label">Passengers</label><input type="number" min="1" value="1" class="form-field"></div><div><label class="label">Cabin</label><select name="cabin" class="form-field"><option>Economy</option><option>Premium Economy</option><option>Business</option><option>First Class</option></select></div><div><label class="label">Promo code</label><input class="form-field" placeholder="Optional"></div><button class="btn-primary self-end">Search flights</button></form></div></section>
{% endblock %}
